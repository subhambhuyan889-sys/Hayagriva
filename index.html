  if(currentAudio){try{currentAudio.pause()}catch{}currentAudio=null}
  if(audioB64){
    try{
      currentAudio=new Audio("data:"+(audioMime||"audio/wav")+";base64,"+audioB64);

$("mic").onclick=()=>listening?stopVoice():startVoice();

function actionCard(a){if(!a||a.type==="none")return;const d=document.createElement("div");d.className="actionCard";const labels={get_location:"Use my location",weather:"Check local weather",maps:"Open maps",search:"Search the web",food:"Find food",shopping:"Find shopping",booking:"Find booking options",vehicle:"Find vehicle help",call:"Make a call",sms:"Send SMS",whatsapp:"Open WhatsApp",email:"Prepare email",sos:"Emergency action"};d.innerHTML="<b>Hayagriva wants to "+(labels[a.type]||"take an action")+"</b><p>"+(a.query||"This action uses a connected device or external service.")+"</p>";const row=document.createElement("div");row.className="actionBtns";const yes=document.createElement("button");yes.className="confirm";yes.textContent=a.requires_confirmation?"Confirm":"Open";const no=document.createElement("button");no.className="cancel";no.textContent="Cancel";row.append(yes,no);d.append(row);$("messages").append(d);$("messages").scrollTop=$("messages").scrollHeight;yes.onclick=()=>{d.remove();runAction(a)};no.onclick=()=>{d.remove();addBubble("ai","Okay. I won't perform that action.");speak("Okay. I won't perform that action.")}}
async function getPos(){return new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000}):rej(new Error("Location is not available in this browser.")))}
async function runAction(a){try{state("Thinking • working on it");if(a.type==="get_location"){const p=await getPos();const q=p.coords.latitude+","+p.coords.longitude;const t="Your current coordinates are "+q+". I can open them in Maps if you want.";addBubble("ai",t);speak(t);window.open("https://www.google.com/maps?q="+encodeURIComponent(q),"_blank");return}
if(a.type==="weather"){const p=await getPos();const u="https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude+"&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m";const r=await fetch(u);const d=await r.json();const c=d.current;const t="Right now it is "+c.temperature_2m+" degrees Celsius, humidity "+c.relative_humidity_2m+" percent, with wind around "+c.wind_speed_10m+" kilometers per hour.";addBubble("ai",t);speak(t);return}
if(a.type==="maps"){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a.query||"nearby places"),"_blank");return}
if(a.type==="search"){window.open("https://www.google.com/search?q="+encodeURIComponent(a.query||"Hayagriva"),"_blank");return}
if(["food","shopping","booking","vehicle"].includes(a.type)){window.open("https://www.google.com/search?q="+encodeURIComponent(a.query||a.type),"_blank");return}
if(a.type==="call"){location.href="tel:"+encodeURIComponent(a.target||"");return}
if(a.type==="sms"){location.href="sms:"+encodeURIComponent(a.target||"")+"?body="+encodeURIComponent(a.query||"");return}
if(a.type==="whatsapp"){window.open("https://wa.me/?text="+encodeURIComponent(a.query||""),"_blank");return}
if(a.type==="email"){location.href="mailto:"+encodeURIComponent(a.target||"")+"?subject="+encodeURIComponent("Hayagriva")+"&body="+encodeURIComponent(a.query||"");return}
if(a.type==="sos"){location.href="tel:112";return}
}catch(e){const t="I couldn't complete that action: "+(e.message||"permission or device access was unavailable.");addBubble("ai",t);speak(t)}finally{state("Listening • ready when you are")}}

async function sendMessage(message){if(!message)return;addBubble("user",(selectedFiles.length?"📎 "+selectedFiles.map(f=>f.name).join(", ")+"\n":"")+message);state("Thinking • Hayagriva is working");const attachments=[];for(const f of selectedFiles.slice(0,3)){if(f.size>4*1024*1024)throw new Error(f.name+" is larger than 4 MB");attachments.push(await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res({name:f.name,mimeType:f.type||"application/octet-stream",data:fr.result});fr.onerror=()=>rej(new Error("Could not read "+f.name));fr.readAsDataURL(f)}))}
let data;for(let attempt=0;attempt<2;attempt++){const c=new AbortController(),timer=setTimeout(()=>c.abort(),45000);try{const r=await fetch(SUPABASE_URL+"/functions/v1/hayagriva-ai?ts="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"x-client-info":"hayagriva-web"},body:JSON.stringify({message,history,attachments,audio:true}),signal:c.signal});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}if(!r.ok)throw new Error(d.error||"Hayagriva server error "+r.status);data=d;break}finally{clearTimeout(timer)}}if(!data)throw new Error("Hayagriva did not respond");const reply=data.reply||data.text||"I'm here. Tell me what you need.";addBubble("ai",reply);history.push({role:"user",text:message},{role:"model",text:reply});history=history.slice(-20);selectedFiles=[];$("files").value="";speak(reply,data.audio,data.audio_mime);if(data.action)actionCard(data.action)}
$("chatForm").onsubmit=async e=>{e.preventDefault();const m=$("prompt").value.trim();$("prompt").value="";$("composer")?.classList.remove("up");try{await sendMessage(m)}catch(err){const t="Hayagriva: "+(err.name==="AbortError"?"The request took too long.":err.message||"Please try again.");addBubble("ai",t);speak(t);state("Listening • ready when you are")}}
$("prompt").addEventListener("input",()=>{$("chatForm").classList.toggle("up",$("prompt").value.length>0);$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,160)+"px"});

function pick(kind){$("files").accept=kind==="image"?"image/*":kind==="video"?"video/*":".pdf,.txt,.doc,.docx";$("files").removeAttribute("capture");$("files").click()}
$("photo").onclick=()=>pick("image");$("video").onclick=()=>pick("video");$("file").onclick=()=>pick("file");$("camera").onclick=()=>$("cameraInput").click();
$("liveCamera").onclick=async()=>{try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});$("cameraVideo").srcObject=cameraStream;$("cameraSheet").hidden=false}catch(e){const t="Camera permission is needed to use the camera.";addBubble("ai",t);speak(t)}};
$("closeCamera").onclick=()=>{if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;$("cameraVideo").srcObject=null;$("cameraSheet").hidden=true};
$("takePhoto").onclick=()=>{const v=$("cameraVideo"),c=document.createElement("canvas");c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(blob=>{const f=new File([blob],"hayagriva-camera.jpg",{type:"image/jpeg"});selectedFiles=[f];$("closeCamera").click();const t="Photo captured. What should I check in it?";addBubble("ai",t);speak(t)},"image/jpeg",.9)};
$("files").onchange=e=>{selectedFiles=[...e.target.files];if(selectedFiles.length){const t="Attached "+selectedFiles.length+" file(s). Tell me what you want me to do with them.";addBubble("ai",t);speak(t)}};$("cameraInput").onchange=e=>{selectedFiles=[...e.target.files];if(selectedFiles.length){const t="Photo captured. What should I check in it?";addBubble("ai",t);speak(t)}};

document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.say;$("chatForm").classList.add("up");$("prompt").focus();});
if("speechSynthesis"in window)speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices());
document.addEventListener("pointermove",e=>{
  const a=$("avatar");if(!a)return;
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.28;
  const dx=Math.max(-5,Math.min(5,(e.clientX-cx)/55)),dy=Math.max(-4,Math.min(4,(e.clientY-cy)/70));
  a.style.setProperty("--gaze-x",dx+"px");a.style.setProperty("--gaze-y",dy+"px");
  const head=a.querySelector(".head");if(head){head.style.transform="rotate("+Math.max(-2.2,Math.min(2.2,(e.clientX-cx)/220))+"deg)"} 
});
$("prompt").addEventListener("focus",()=>state("Listening • ready to receive your message"));

(async()=>{showAuth();const hash=new URLSearchParams(location.hash.replace(/^#/,""));if(hash.get("access_token")&&hash.get("refresh_token")){save({access_token:hash.get("access_token"),refresh_token:hash.get("refresh_token"),expires_at:hash.get("expires_at")});history=[];history.push({role:"model",text:"Namaste. Main Hayagriva hoon."});window.history.replaceState(null,"",location.pathname);showApp();return}const s=saved();if(s){const f=await refresh(s);if(f)showApp()}})();
</script>
